[package]
name = "osd-cli"
description = "osd — Open Science Desktop without a window: a headless server and a client for it."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "osd"
path = "src/main.rs"

[dependencies]
osd-core.workspace = true
serde_json.workspace = true
reqwest.workspace = true

# Unix only, and only for one thing: a SIGTERM handler, so a supervisor
# stopping `osd server` also stops the OpenCode sidecar instead of orphaning it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
