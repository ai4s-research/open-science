[package]
name = "osd-core"
description = "Open Science Desktop — the server core: workspace, OpenCode sidecar, and gateway. No GUI, no Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
getrandom.workspace = true
# Watches the active workspace so file changes from outside the app (an
# external editor, a detached process) still enqueue a debounced git snapshot.
notify = "6"

# System proxy on Windows is read through WinHTTP (manual proxy, bypass list
# and PAC evaluation) rather than by parsing the registry — see system_proxy.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
