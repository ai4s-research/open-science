name: build

# Builds macOS (.dmg/.app), Windows (NSIS .exe + WiX .msi) and Linux
# (.deb/.rpm) installers. Each platform's installer can only be
# produced on its own runner — hence the matrix. On a `v*` tag push the
# installers are also attached to a draft GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# tauri-action needs to create the draft release and upload assets.
permissions:
  contents: write

# One build per ref at a time. A tag push produced TWO identical runs one second
# apart here, and both went on to write the same draft release — duplicate
# assets, and a race over which one wins. Newer wins; the older is cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled OpenCode sidecar
        shell: bash
        run: bash scripts/dev/fetch-opencode.sh ${{ matrix.target }}

      - name: Fetch bundled ai4s-skills pack
        shell: bash
        run: bash scripts/dev/fetch-skills.sh

      - name: Fetch bundled uv sidecar
        shell: bash
        run: bash scripts/dev/fetch-uv.sh ${{ matrix.target }}

      - name: Fetch bundled agent-browser sidecar
        shell: bash
        run: bash scripts/dev/fetch-agent-browser.sh ${{ matrix.target }}

      - name: Fetch bundled goal plugin
        shell: bash
        run: bash scripts/dev/fetch-goal-plugin.sh

      # A fetch script can fail without failing its step: a bash syntax error in
      # fetch-agent-browser.sh aborted the script on every platform, but macOS's
      # bash 3.2 still exited 0, so macOS shipped installers missing the bundled
      # browser skill while Linux and Windows failed loudly. Assert the bundled
      # resources exist rather than trusting the fetch steps' exit codes.
      - name: Verify bundled resources
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          status=0
          for path in \
            runtime/skills/external/ai4s-skills \
            runtime/skills/external/anthropic-skills \
            runtime/skills/external/agent-browser/open-science-browser/SKILL.md \
            runtime/goal-plugin/goal-plugin.server.js \
            runtime/browser-plugin/browser-guard.ts \
            runtime/history-plugin/history-guard.ts \
            "apps/desktop/src-tauri/binaries/opencode-${{ matrix.target }}$ext" \
            "apps/desktop/src-tauri/binaries/uv-${{ matrix.target }}$ext" \
            "apps/desktop/src-tauri/binaries/agent-browser-${{ matrix.target }}$ext"; do
            if [ ! -e "$path" ]; then
              echo "Missing bundled resource: $path" >&2
              status=1
            fi
          done
          exit "$status"

      # `osd` is a sidecar like the other three, except that it is ours and
      # compiles the web client into itself — so it is built here, BEFORE the
      # Tauri build bundles it. The step fails loudly if the binary does not
      # appear, because Tauri would otherwise fail its own externalBin check.
      - name: Build the osd sidecar
        shell: bash
        run: bash scripts/dev/build-osd-sidecar.sh ${{ matrix.target }}

      - name: Configure macOS release signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::A macOS release must be Developer ID-signed and notarized. Missing secrets: ${missing[*]}"
            exit 1
          else
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::notice::Unsigned macOS development artifact; tagged releases require Developer ID signing."
          fi

      - name: Build the app (Tauri)
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          # Linux: deb+rpm only. AppImage is off because linuxdeploy runs ldd
          # on every bundled ELF and ldd exits 1 on the Bun-built opencode
          # sidecar, aborting the whole bundle (tauri-apps/tauri#8929).
          # Windows ships BOTH: the NSIS .exe is the default download
          # (per-user, no admin), and the WiX .msi exists for IT-managed
          # deployment, which is what Group Policy and Intune consume — 6-10%
          # of Windows downloads have taken it every release. They must not be
          # presented as interchangeable: installing one over the other leaves
          # the app registered twice, which is the mess issue #113 sits next
          # to. The release notes label them by audience.
          # macOS submits the signed app without blocking inside Tauri. The
          # following steps preserve that exact app, wait with a bounded retry
          # loop, staple it, and create the final DMG.
          args: --target ${{ matrix.target }} ${{ startsWith(matrix.platform, 'macos') && env.MACOS_SIGNING_ENABLED == 'true' && '--bundles app --skip-stapling' || startsWith(matrix.platform, 'macos') && '--bundles dmg' || startsWith(matrix.platform, 'ubuntu') && '--bundles deb,rpm' || '--bundles nsis,msi' }}
          # On a v* tag push, attach installers to a draft GitHub Release.
          # Empty tagName (workflow_dispatch) skips release creation.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Open Science Desktop {0}', github.ref_name) || '' }}
          releaseDraft: true
          # Standing install/first-launch notes. Tagged macOS releases are blocked
          # above unless Developer ID signing + notarization credentials are
          # present; Windows remains unsigned for now.
          releaseBody: |
            ## Install & first launch

            **macOS** — Apple Silicon: `…_aarch64.dmg` · Intel: `…_x64.dmg` (requires macOS 13+)
            - Developer ID-signed and notarized. Open the DMG and drag **Open Science** into Applications.
            - When you use an existing project in place, allow access to its folder if macOS asks.

            **Windows** — `…_x64-setup.exe` (start here) · `…_x64_en-US.msi` (IT-managed deployment only)
            - SmartScreen shows *"Windows protected your PC"* → **More info** → **Run anyway**.
            - Upgrading: choose **"Install over it, keeping my data"**. Removing the old version first is only for repairing a failed upgrade.
            - Uninstalling: leave **"Also delete my sessions, run history and settings"** unchecked unless you mean it — it erases `%APPDATA%\com.ai4s.workbench`.
            - Pick one format and stay on it. Installing the `.exe` over an `.msi` install (or the reverse) registers the app twice; uninstall the old one from **Settings → Apps** first.

            **Linux** — `.deb` / `.rpm`
            - `sudo apt install ./…_amd64.deb`  or  `sudo rpm -i …x86_64.rpm`

            > **No in-app auto-update** — download new versions from this Releases page. (The `.app.tar.gz` assets are build artifacts, not an update channel.)

            ---

            <!-- Prepend this release's changelog above this line before publishing. -->

      # `osd` — the same workbench with no window, for machines that have no
      # display to put one on. Packaged after the Tauri build so it reuses the
      # frontend that build just produced (the web client is compiled into the
      # binary) and the sidecars fetched above.
      - name: Package the osd CLI
        id: osd
        if: steps.tauri_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          archive=$(bash scripts/release/package-osd.sh "${{ matrix.target }}" | tail -1)
          # Hand the next step a WORKSPACE-RELATIVE path. `upload-artifact` is a
          # Node action, and on Windows it cannot resolve the MSYS path this
          # shell speaks (/d/a/…), so an absolute one uploads nothing at all.
          archive="${archive#"$PWD/"}"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          ls -la "$archive"

      - name: Upload the osd CLI
        if: steps.osd.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: osd-${{ matrix.target }}
          path: ${{ steps.osd.outputs.archive }}
          if-no-files-found: error

      - name: Attach the osd CLI to the draft release
        if: steps.osd.outcome == 'success' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.osd.outputs.archive }}" --clobber

      - name: Preserve submitted macOS app
        id: macos_app
        if: always() && runner.os == 'macOS' && env.MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          app_path=$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit 2>/dev/null || true)
          if [ -z "$app_path" ]; then
            echo "::warning::No macOS app bundle was produced."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) suffix=aarch64 ;;
            x86_64-apple-darwin) suffix=x64 ;;
            *) echo "::error::Unsupported macOS target: ${{ matrix.target }}"; exit 1 ;;
          esac

          archive_dir="$RUNNER_TEMP/macos-submitted-app"
          archive_path="$archive_dir/Open.Science_${version}_${suffix}.submitted.app.zip"
          dmg_path="$PWD/target/${{ matrix.target }}/release/bundle/dmg/Open.Science_${version}_${suffix}.dmg"
          mkdir -p "$archive_dir"
          ditto -c -k --keepParent --sequesterRsrc "$app_path" "$archive_path"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Upload submitted macOS app
        if: always() && steps.macos_app.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai4s-workbench-${{ matrix.target }}-submitted-app
          path: ${{ steps.macos_app.outputs.archive_path }}
          if-no-files-found: error

      - name: Queue submitted macOS app on draft release
        if: steps.macos_app.outputs.found == 'true' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.macos_app.outputs.archive_path }}" --clobber

      - name: Wait for notarization and create macOS DMG
        id: finalize_macos
        if: steps.tauri_build.outcome == 'success' && steps.macos_app.outputs.found == 'true' && env.MACOS_SIGNING_ENABLED == 'true' && github.ref_type != 'tag'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_NOTARIZATION_TIMEOUT_SECONDS: 5400
          MACOS_NOTARIZATION_POLL_SECONDS: 60
        run: |
          bash scripts/release/finalize-macos-notarization.sh \
            "${{ steps.macos_app.outputs.app_path }}" \
            "${{ steps.macos_app.outputs.dmg_path }}"

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai4s-workbench-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
          if-no-files-found: warn
